name: nanoplastics_app
description: NanoSolve Hive - Crowdsourcing R&D solutions for nanoplastic pollution
publish_to: 'none'
version: 1.0.58+51

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  http: ^1.1.0
  http_parser: ^4.0.0
  uuid: ^4.0.0
  firebase_core: ^2.32.0
  firebase_crashlytics: ^3.4.0
  firebase_messaging: ^14.7.10
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.2.0
  flutter_custom_tabs: ^2.1.0
  pdfx: ^2.6.0
  file_picker: ^8.1.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  record: ^6.0.0
  share_plus: ^10.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.69.0
  package_info_plus: ^4.2.0
  connectivity_plus: ^6.0.0
  android_package_installer: ^0.0.3
  web: any
  # Google Play Store updates only
  in_app_update: ^4.2.3
  tutorial_coach_mark: ^1.2.8
  webview_flutter: ^4.9.0
  # Direct declarations of transitive deps actually used in lib/
  image: ^4.0.0
  crypto: ^3.0.0
  vector_math: ^2.1.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 10
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
flutter:
  generate: true
  uses-material-design: true
  assets:
    # ISRG Root X1. Android added it to the system store in 7.1.1 (API 25) and
    # minSdk is 24, so 7.0-7.1.0 needs it from the app or every HTTPS call fails.
    - assets/certs/isrgrootx1.pem
    - assets/images/
    - assets/l10n/app_cs.arb
    - assets/l10n/app_en.arb
    - assets/onboarding/slide1_ocean_plastic.jpg
    - assets/onboarding/slide2_missions.jpg
    - assets/onboarding/slide3_collaboration.jpg
    - assets/docs/Nanoplastics_Report_EN_compressed.pdf
    - assets/docs/EN_report_nanoplastics_a_systematic_risk_analysis_for_human_health_ecosystems_and_the_environment_compressed.pdf
    - assets/docs/EN_WATER_compressed.pdf
    - assets/docs/CS_WATER_compressed.pdf
    - assets/docs/ESP-WATER_compressed.pdf
    - assets/docs/FR-WATER_compressed.pdf
    - assets/docs/RUS-WATER_compressed.pdf
    - assets/docs/CS_Nove_metody_detekce_a_reseni_nanoplastu.pdf
    - assets/docs/Nanoplastics_Report_CS_compressed.pdf
    - assets/docs/Nanoplastics_Report_ES_compressed.pdf
    - assets/docs/Nanoplastics_Report_FR_compressed.pdf
    - assets/docs/Nanoplastics_Report_RU_compressed.pdf
