name: Flutter Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Triggers when you push a tag like v1.0.2
  workflow_dispatch:
    inputs:
      publish_aab:
        description: "Build & publish Play Store AAB to release"
        type: boolean
        default: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential for creating the release without a manual token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- GENERATE FIREBASE OPTIONS ---
      - name: Restore firebase_options.dart from secret
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart

      # --- EXTRACT VERSION FROM PUBSPEC ---
      # This pulls the 'version: 1.2.3+4' from your pubspec.yaml
      # to use as a fallback if no git tag is present.
      - name: Get Version from Pubspec
        id: pubspec_version
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------------- FLUTTER ----------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      # ---------------- RESTORE FIREBASE CONFIG ----------------
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      # ---------------- RESTORE ANDROID SIGNING KEY ----------------
      - name: Restore Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      # ---------- SET SIGNING ENVIRONMENT VARIABLES ----------
      - name: Set Signing Environment Variables
        run: |
          echo "KEYSTORE_PATH=$(pwd)/android/app/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "BACKEND_URL=${{ secrets.BACKEND_URL_PROD }}" >> $GITHUB_ENV
          echo "WEBHOOK_SECRET=${{ secrets.RELEASE_WEBHOOK_SECRET }}" >> $GITHUB_ENV

      # ---------- INSTALL YQ ----------
      # ---------- VALIDATE PUBSPEC ------
      - name: Validate pubspec.yaml
        run: |
          echo "Validating pubspec.yaml..."
          if ! grep -q "^name:" pubspec.yaml; then
            echo "ERROR: pubspec.yaml is invalid - missing 'name' field"
            exit 1
          fi
          if ! grep -q "^version:" pubspec.yaml; then
            echo "ERROR: pubspec.yaml is invalid - missing 'version' field"
            exit 1
          fi
          echo "pubspec.yaml is valid"

      # --- VALIDATE BACKEND URL ---
      - name: Validate Backend Configuration
        run: |
          if [ -z "${{ secrets.BACKEND_URL_PROD }}" ]; then
            echo "ERROR: BACKEND_URL_PROD secret is not set"
            exit 1
          fi
          echo "Backend URL configured for production build"

      # ---------------- DEPENDENCIES ----------------
      - name: Install dependencies
        run: flutter pub get

      # ---------------- QUALITY GATES ----------------
      - name: Format dart files
        run: dart format lib/

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Tests (Web platform)
        run: flutter test --platform chrome

      - name: Run Compliance Tests (Mobile platform)
        run: flutter test test/compliance/google_play_release_test.dart

      # ---------------- L10N GENERATION ----------------
      - name: Generate l10n files
        run: bash run_generate_langs.sh

      # ---------------- FULL FLAVOR APK (sideload / in-app update) ----------------
      - name: Build FULL APK
        run: |
          flutter build apk --release --flavor full --dart-define=DISTRIBUTION=github --dart-define=BACKEND_URL=${{ env.BACKEND_URL }}
          mv build/app/outputs/flutter-apk/app-full-release.apk build/app/outputs/flutter-apk/nanoplastics_app.apk

      - name: Compute release metadata
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="$VERSION"
          fi

          format_mb() {
            awk -v bytes="$1" 'BEGIN {
              mb = bytes / (1024 * 1024)
              printf(mb >= 100 ? "%.0f MB" : "%.1f MB", mb)
            }'
          }

          FULL_APK_PATH="build/app/outputs/flutter-apk/nanoplastics_app.apk"
          REPO="glmcz/nanoplastics_frontend"

          FULL_APK_SIZE_BYTES=$(stat -c%s "$FULL_APK_PATH")
          FULL_APK_SIZE=$(format_mb "$FULL_APK_SIZE_BYTES")
          FULL_APK_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG/nanoplastics_app.apk"

          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "FULL_APK_SIZE=$FULL_APK_SIZE" >> $GITHUB_ENV
          echo "FULL_APK_URL=$FULL_APK_URL" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: build/app/outputs/flutter-apk/nanoplastics_app*.apk

      # ---------------- CREATE RELEASE ----------------
      - name: Publish Release
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/nanoplastics_app.apk
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## Download

            | Variant | Size | Languages |
            |---------|------|-----------|
            | **nanoplastics_app.apk** | ${{ env.FULL_APK_SIZE }} | EN · CS · ES · FR · RU |

            Play Store build (AAB): available in Google Play Console.

      - name: Render docs download page
        run: |
          export FULL_APK_URL FULL_APK_SIZE
          perl -0pi -e 's|<a id="full-apk-download" href="[^"]*" class="btn btn-primary">.*?</a>|<a id="full-apk-download" href="$ENV{FULL_APK_URL}" class="btn btn-primary">📱 Download Full ($ENV{FULL_APK_SIZE})</a>|g' docs/index.html
          cp docs/index.html /tmp/nanoplastics-docs-index.html

      - name: Persist generated docs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            git restore docs/index.html
            git fetch origin main:main
            git switch main
            cp /tmp/nanoplastics-docs-index.html docs/index.html
          fi

          if git diff --quiet -- docs/index.html; then
            echo "No docs changes to commit"
            exit 0
          fi

          git add docs/index.html
          git commit -m "docs: update release download sizes"
          git push origin HEAD:main

      # ---------------- NOTIFY BACKEND ----------------
      - name: Notify backend of new release
        if: env.WEBHOOK_SECRET != '' && env.BACKEND_URL != ''
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' for the version field
          VERSION="${RELEASE_TAG#v}"
          REPO="glmcz/nanoplastics_frontend"
          FULL_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG/nanoplastics_app.apk"
          curl -sf -X POST "$BACKEND_URL/api/release" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"$VERSION\",\"full_apk_url\":\"$FULL_URL\",\"published_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"notes\":null}" \
            || echo "Backend webhook failed (non-fatal)"
