name: Flutter Release AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build_aab:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- EXTRACT VERSION FROM PUBSPEC ---
      - name: Get Version from Pubspec
        id: pubspec_version
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      # --- RESTORE FIREBASE OPTIONS ---
      - name: Restore firebase_options.dart from secret
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --- SETUP FLUTTER ---
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      # --- RESTORE FIREBASE CONFIG ---
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      # --- RESTORE ANDROID SIGNING KEY ---
      - name: Restore Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      # --- SET SIGNING ENVIRONMENT VARIABLES ---
      - name: Set Signing Environment Variables
        run: |
          echo "KEYSTORE_PATH=$(pwd)/android/app/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "BACKEND_URL=${{ secrets.BACKEND_URL_PROD }}" >> $GITHUB_ENV

      # --- GENERATE FULL PUBSPEC (includes non-EN PDFs) ---
      # --- INSTALL DEPENDENCIES ---
      - name: Install dependencies
        run: flutter pub get

      # --- FORMAT & ANALYZE ---
      - name: Format dart files
        run: dart format lib/

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Compliance Tests (Mobile platform)
        run: flutter test test/compliance/google_play_release_test.dart

      # --- BUILD PLAY AAB ---
      - name: Build PLAY AAB (Google Play)
        run: |
          flutter build appbundle --release --flavor play --dart-define=BACKEND_URL=${{ env.BACKEND_URL }} --dart-define=IS_PLAY_STORE=true --dart-define=DISTRIBUTION=playStore
          cp build/app/outputs/bundle/playRelease/app-play-release.aab build/app/outputs/bundle/playRelease/nanoplastics_app_play.aab || true

      # --- UPLOAD TO RELEASE ---
      - name: Upload AAB to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: build/app/outputs/bundle/playRelease/nanoplastics_app_play.aab
          fail_on_unmatched_files: false

      # --- PUBLISH TO GOOGLE PLAY PRODUCTION TRACK ---
      - name: Publish to Google Play Production Track
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: org.nanosolve.hive
          releaseFiles: build/app/outputs/bundle/playRelease/app-play-release.aab
          track: production
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          status: completed
